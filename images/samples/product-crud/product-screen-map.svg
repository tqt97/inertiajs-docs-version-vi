<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Bản đồ UI Product CRUD</title>
  <desc id="desc">Minh họa danh sách sản phẩm có thumbnail và form chỉnh sửa có preview ảnh cùng progress upload.</desc>
  <rect width="1200" height="680" fill="#f5f5f5"/>
  <style>.panel{fill:#fff;stroke:#d4d4d4;stroke-width:2}.t{font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.s{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#525252}.muted{fill:#e5e5e5}.dark{fill:#171717}</style>
  <rect class="panel" x="45" y="45" width="525" height="590" rx="18"/><text class="t" x="75" y="90">Products / Index</text><rect class="muted" x="75" y="120" width="465" height="45" rx="8"/>
  <text class="s" x="90" y="148">Search + filter + sort → partial reload</text>
  <g transform="translate(75 195)">
    <rect class="muted" width="56" height="56" rx="10"/><text class="s" x="75" y="25">Mechanical Keyboard</text><text class="s" x="75" y="48">KB-001 · 1.290.000 ₫</text>
    <rect class="muted" y="85" width="56" height="56" rx="10"/><text class="s" x="75" y="110">Wireless Mouse</text><text class="s" x="75" y="133">MS-008 · 690.000 ₫</text>
    <rect class="muted" y="170" width="56" height="56" rx="10"/><text class="s" x="75" y="195">USB-C Hub</text><text class="s" x="75" y="218">HB-021 · 890.000 ₫</text>
  </g>
  <text class="s" x="75" y="500">• thumbnail từ server prop</text><text class="s" x="75" y="528">• prefetch create/edit</text><text class="s" x="75" y="556">• optimistic toggle + reconcile</text>

  <rect class="panel" x="630" y="45" width="525" height="590" rx="18"/><text class="t" x="660" y="90">Products / Edit</text>
  <rect class="muted" x="660" y="120" width="145" height="145" rx="14"/><text class="s" x="682" y="195">Image preview</text>
  <rect class="panel" x="830" y="120" width="285" height="38" rx="8"/><text class="s" x="845" y="145">Choose image...</text>
  <rect class="muted" x="830" y="175" width="285" height="12" rx="6"/><rect class="dark" x="830" y="175" width="190" height="12" rx="6"/><text class="s" x="830" y="212">Upload progress 67%</text>
  <rect class="panel" x="660" y="285" width="455" height="44" rx="8"/><text class="s" x="675" y="312">Tên sản phẩm</text>
  <rect class="panel" x="660" y="345" width="455" height="44" rx="8"/><text class="s" x="675" y="372">SKU</text>
  <rect class="panel" x="660" y="405" width="455" height="44" rx="8"/><text class="s" x="675" y="432">Giá</text>
  <rect class="dark" x="660" y="495" width="140" height="44" rx="8"/><text x="687" y="523" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#fff">Lưu thay đổi</text>
  <text class="s" x="660" y="575">processing · errors · isDirty · cancel · progress</text>
</svg>
